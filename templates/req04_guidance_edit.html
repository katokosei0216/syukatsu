{% extends "base.html" %}
{% block title %}指導メモの編集{% endblock %}
{% block content %}
<p class="muted"><a href="/req04/{{ student['id'] }}">← {{ student["name"] }} の詳細に戻る</a></p>
<h1>指導メモの編集</h1>

<div class="card">
  <p class="muted">対象: {{ student["name"] }} / 記録日時: {{ guidance["created_at"] }}</p>
  <form method="post" action="/req04/{{ student['id'] }}/guidance/{{ guidance['id'] }}/edit">
    <div class="inline-form">
      <select name="category">
        {% for c in categories %}
        <option value="{{ c }}"{% if c == guidance['category'] %} selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
      <label class="muted">次回指導日
        <input type="date" name="next_guidance_date" value="{{ guidance['next_guidance_date'] }}">
      </label>
    </div>
    <textarea name="memo" required>{{ guidance["memo"] }}</textarea>
    <div class="row-actions">
      <button type="submit">保存する</button>
      <a class="btn-cancel btn-small" href="/req04/{{ student['id'] }}">キャンセル</a>
    </div>
  </form>
</div>
{% endblock %}
